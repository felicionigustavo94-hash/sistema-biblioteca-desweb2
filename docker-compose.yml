services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: "Biblioteca API"
      APP_ENV: local
      APP_KEY: base64:7B5L3GvH5P7/0n1zC1k0Jj5ZpW5u8Q7gX9y2a4B6c8D=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: biblioteca_db
      DB_USERNAME: biblioteca_user
      DB_PASSWORD: secret_password
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: biblioteca_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: biblioteca_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca_user -d biblioteca_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local